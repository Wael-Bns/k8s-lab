apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-lab-api
  namespace: k8s-lab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-lab-api
                port:
                  number: 80